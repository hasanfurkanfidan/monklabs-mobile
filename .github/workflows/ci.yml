name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Makes Expo CLI non-interactive.
  CI: true

jobs:
  verify:
    name: Typecheck, lint, format, test, Expo checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json#packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Expo dependency and config checks
        run: pnpm expo:check

      - name: Expo Doctor
        working-directory: apps/playground
        run: pnpm dlx expo-doctor@1.21.5

      - name: Bundle playground JavaScript (Android + iOS)
        working-directory: apps/playground
        run: pnpm exec expo export --platform android --platform ios --output-dir dist
