packages:
  - apps/*
  - packages/*

# Single source of truth for versions shared across workspace packages.
# Expo SDK-managed versions must match `npx expo install --check` for the current SDK (58).
catalog:
  expo: ~58.0.21
  react: 19.3.0
  react-native: 0.88.1
  react-native-safe-area-context: ~5.10.1
  '@types/react': ~19.3.0
  typescript: ~6.0.3
  jest: ~30.5.2
  jest-expo: ~58.0.13
  '@react-native/jest-preset': 0.88.1
  '@testing-library/react-native': ^14.1.0
  test-renderer: ^1.3.1
  '@types/jest': ^30.0.0
  eslint: ~9.39.5
  eslint-config-expo: ~58.0.4
  eslint-config-prettier: ^10.1.8
  prettier: 3.9.10

overrides:
  # react-dom is pulled in as an optional peer by Expo Router's web runtime. Keep it aligned with
  # the React version bundled by Expo SDK 58 so there is exactly one React version in the graph.
  react-dom: 19.3.0

# pnpm blocks dependency build scripts unless explicitly decided here. Both packages below ship
# prebuilt binaries through optional dependencies, so their install scripts are not needed.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false
